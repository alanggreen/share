<style>html{color-scheme:light}body{margin:0;font:14px system-ui}</style>
<title>Boaz Is Two</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;600&display=swap">
<style>
/* Layout: one centered sticker-style card. Headline above, painted scene in the middle, message and name field below. */
:root {
  --sun: #FFE27A;
  --ink: #2A2350;
  --sky: #BFE9F7;
  --pink: #FF8FB1;
  --grass: #6CC070;
  --grass-deep: #4FA86A;
  --display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --body: 'Fredoka', 'Trebuchet MS', sans-serif;
  color-scheme: light;
}
body {
  background: var(--sun);
  color: var(--ink);
  font-family: var(--body);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding-inline: 16px;
  padding-block: 28px 40px;
}
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.1rem, 8.5vw, 3.3rem);
  line-height: 1.05;
  letter-spacing: 0.01em;
  text-align: center;
  text-wrap: balance;
  margin: 0;
  max-width: 520px;
}
.card {
  width: 100%;
  max-width: 520px;
  border: 3px solid var(--ink);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 6px 6px 0 var(--ink);
  background: var(--sky);
}
#scene { display: block; width: 100%; height: auto; touch-action: manipulation; }
.msg { font-size: 1.2rem; line-height: 1.45; text-align: center; max-width: 32ch; margin: 0; text-wrap: balance; }
.hint { font-size: 1rem; font-weight: 600; margin: -8px 0 0; text-align: center; }
.play {
  font-family: var(--display);
  font-size: 1.4rem;
  color: var(--ink);
  background: var(--pink);
  border: 3px solid var(--ink);
  border-radius: 999px;
  padding: 12px 30px;
  box-shadow: 4px 4px 0 var(--ink);
  cursor: pointer;
}
.play:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.play:disabled { opacity: .75; cursor: default; }
.play:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

/* scene parts */
.animal { cursor: default; }
#scene.ready .animal { cursor: pointer; }
.animal:focus { outline: none; }
.hit { fill: transparent; }
.ring { fill: none; stroke: var(--ink); stroke-width: 3; stroke-dasharray: 6 6; opacity: 0; }
.animal:focus-visible .ring { opacity: 1; }
#bubble { opacity: 0; pointer-events: none; transition: opacity .15s; }
#bubble.on { opacity: 1; }

/* motion: one load sequence (the 2 drops, then the animals pop up one by one), then gentle ambient movement */
.two, .pop, .idle, .bob { transform-box: fill-box; transform-origin: 50% 100%; }
.two { animation: drop .9s cubic-bezier(.3, .7, .4, 1) .2s backwards; }
.pop { animation: rise .6s ease-out backwards; animation-delay: calc(var(--i) * .18s + 1.05s); }
.idle { animation: breathe 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * .45s); }
.bob { animation: bob 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * .6s); }
.cloud { animation: drift 9s ease-in-out infinite; animation-delay: calc(var(--i) * -4s); }
@keyframes drop {
  0% { transform: translateY(-280px); }
  60% { transform: translateY(8px) scale(1.05, .93); }
  80% { transform: translateY(-4px); }
  100% { transform: none; }
}
@keyframes rise {
  0% { opacity: 0; transform: translateY(90px) scale(.6); }
  15% { opacity: 1; }
  70% { opacity: 1; transform: translateY(-8px) scale(1.05); }
  100% { opacity: 1; transform: none; }
}
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(18px); } }
@media (prefers-reduced-motion: reduce) {
  .two, .pop, .idle, .bob, .cloud { animation: none; }
  #bubble { transition: none; }
}
</style>

<p class="msg">Two whole years. Time to trumpet, swing, build Duplo, read one more story and spot the tallest mushroom.</p>
<button class="play" id="play" type="button">Play the song</button>
<p class="hint" id="hint" aria-live="polite">Press play for a birthday song.</p>

<script>
(function () {
  var scene = document.getElementById('scene');
  var bubble = document.getElementById('bubble');
  var bb = document.getElementById('bb');
  var bt = document.getElementById('bt');
  var playBtn = document.getElementById('play');
  var hint = document.getElementById('hint');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var animals = Array.prototype.slice.call(document.querySelectorAll('.animal'));
  var locked = true;
  var playing = false;
  var timer;

  /* ---------- sound ---------- */
  var ctx = null, master = null, noiseBuf = null;
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      var comp = ctx.createDynamicsCompressor();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(comp);
      comp.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.2), ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function env(g, t, peak, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(o) {
    var osc = ctx.createOscillator(), g = ctx.createGain(), node = osc;
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, o.t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, o.t + o.dur * (o.ramp || 1));
    if (o.vib) {
      var lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = o.vib;
      lg.gain.value = o.vibDepth || 12;
      lfo.connect(lg);
      lg.connect(osc.frequency);
      lfo.start(o.t);
      lfo.stop(o.t + o.dur + 0.05);
    }
    if (o.lp) {
      var f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = o.lp;
      osc.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(master);
    env(g, o.t, o.gain || 0.3, o.attack || 0.01, o.dur);
    osc.start(o.t);
    osc.stop(o.t + o.dur + 0.05);
  }
  function noiseBurst(t, dur, gain) {
    var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf;
    f.type = 'lowpass';
    f.frequency.value = 900;
    src.connect(f);
    f.connect(g);
    g.connect(master);
    env(g, t, gain, dur * 0.35, dur);
    src.start(t);
    src.stop(t + dur + 0.02);
  }
  function musicBox(freq, dur, t, decayTail) {
    var parts = [[1, 0.22], [2, 0.1], [3.01, 0.05]];
    parts.forEach(function (p, i) {
      tone({ type: 'sine', f0: freq * p[0], t: t, dur: i === 0 ? dur + decayTail : 0.5 + i * 0.1, gain: p[1], attack: 0.004 });
    });
  }
  var SOUNDS = {
    'Giraffe': function (t) { for (var k = 0; k < 3; k++) noiseBurst(t + k * 0.17, 0.09, 0.6); },
        'Monkey': function (t) {
      for (var k = 0; k < 2; k++) {
        tone({ f0: 480, f1: 740, t: t + k * 0.38, dur: 0.28, gain: 0.32, vib: 9, vibDepth: 14, attack: 0.03 });
        tone({ f0: 960, f1: 1480, t: t + k * 0.38, dur: 0.28, gain: 0.08, attack: 0.03 });
      }
    },
    'Elephant': function (t) {
      tone({ type: 'sawtooth', f0: 300, f1: 480, ramp: 0.4, t: t, dur: 0.3, gain: 0.2, lp: 1100, vib: 22, vibDepth: 6, attack: 0.02 });
      tone({ type: 'sawtooth', f0: 300, f1: 480, ramp: 0.3, t: t + 0.38, dur: 0.46, gain: 0.2, lp: 1100, vib: 22, vibDepth: 6, attack: 0.02 });
    },
    'Mushrooms': function (t) {
      tone({ f0: 1050, f1: 160, t: t, dur: 0.12, gain: 0.5, attack: 0.002 });
    }
  };

  /* ---------- motion ---------- */
  function hop(el) {
    if (reduce.matches) return;
    var inner = el.querySelector('.idle');
    if (inner && inner.animate) {
      inner.animate([
        { transform: 'translateY(0) scale(1,1)', offset: 0 },
        { transform: 'translateY(6px) scale(1.08,.9)', offset: 0.15 },
        { transform: 'translateY(-34px) scale(.94,1.08)', offset: 0.5 },
        { transform: 'translateY(0) scale(1.06,.94)', offset: 0.8 },
        { transform: 'translateY(0) scale(1,1)', offset: 1 }
      ], { duration: 560, easing: 'ease-out' });
    }
  }
  function say(el) {
    var word = el.getAttribute('data-say');
    var cx = Number(el.getAttribute('data-bx'));
    var y = Number(el.getAttribute('data-by'));
    var w = 24 + word.length * 11;
    var x = Math.max(6, Math.min(394 - w, cx - w / 2));
    bb.setAttribute('width', w);
    bt.setAttribute('x', w / 2);
    bt.textContent = word;
    bubble.setAttribute('transform', 'translate(' + x + ',' + y + ')');
    bubble.classList.add('on');
    clearTimeout(timer);
    timer = setTimeout(function () { bubble.classList.remove('on'); }, 1400);
  }
  function tap(el) {
    if (locked) return;
    var c = audio();
    if (c) {
      var fn = SOUNDS[el.getAttribute('aria-label')];
      if (fn) fn(c.currentTime + 0.02);
    }
    say(el);
    hop(el);
  }

  function setLocked(v) {
    locked = v;
    scene.classList.toggle('ready', !v);
    animals.forEach(function (a) { a.setAttribute('aria-disabled', v ? 'true' : 'false'); });
  }
  setLocked(true);

  /* ---------- the song ---------- */
  var G4 = 392.0, A4 = 440.0, B4 = 493.88, C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99;
  var LINES = [
    { n: [G4, G4, A4, G4, C5, B4], d: [0.75, 0.25, 1, 1, 1, 2] },
    { n: [G4, G4, A4, G4, D5, C5], d: [0.75, 0.25, 1, 1, 1, 2] },
    { n: [G4, G4, G5, E5, C5, B4, A4], d: [0.75, 0.25, 1, 1, 1, 1, 2] },
    { n: [F5, F5, E5, C5, D5, C5], d: [0.75, 0.25, 1, 1, 1, 2] }
  ];
  var Q = 0.55;

  function playSong() {
    if (playing) return;
    playing = true;
    setLocked(true);
    bubble.classList.remove('on');
    playBtn.disabled = true;
    playBtn.textContent = 'Playing…';
    hint.textContent = 'Listen to the birthday song.';
    var c = audio();
    var r = 0.25;
    var n = 0;
    LINES.forEach(function (line) {
      line.n.forEach(function (f, i) {
        var d = line.d[i] * Q;
        var last = i === line.n.length - 1;
        if (c) musicBox(f, d, c.currentTime + r, last ? 1.5 : 0.8);
        (function (idx, isLast) {
          setTimeout(function () {
            if (isLast) animals.forEach(hop);
            else hop(animals[idx % animals.length]);
          }, r * 1000);
        })(n, last);
        r += d;
        n++;
      });
      r += 0.3;
    });
    setTimeout(function () {
      playing = false;
      setLocked(false);
      playBtn.disabled = false;
      playBtn.textContent = 'Play the song again';
      hint.textContent = 'Tap an animal to say hi.';
    }, (r + 1.2) * 1000);
  }
  playBtn.addEventListener('click', playSong);

  animals.forEach(function (el) {
    el.addEventListener('click', function () { tap(el); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(el); }
    });
  });

})();
</script>
